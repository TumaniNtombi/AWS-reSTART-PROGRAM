<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Climate Resilience Command Center</title>
  <link rel="stylesheet" href="styles.css"/>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2>CLIMATE OPS</h2>
      <nav>
        <a href="#" onclick="showPage('dashboard')">Dashboard</a>
        <a href="#" onclick="showPage('agents')">AI Agents</a>
        <a href="#" onclick="showPage('data')">Farm Data</a>
        <a href="#" onclick="showPage('settings')">Settings</a>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- LOGIN -->
      <section id="login" class="page active">
        <h1>Secure Access</h1>
        <p>Sign in to Climate Resilience Platform</p>
        <button onclick="mockLogin()">Sign In</button>
      </section>

      <!-- DASHBOARD -->
      <section id="dashboard" class="page">
        <h1>Command Dashboard</h1>

        <div class="grid">
          <div class="card">🌍 Climate Risk Index</div>
          <div class="card">🌾 Farm Health Status</div>
          <div class="card">⚡ Active Alerts</div>
          <div class="card">🤖 AI Recommendations</div>
        </div>
      </section>

      <!-- AGENTS -->
      <section id="agents" class="page">
        <h1>AI Agents</h1>
        <div class="card">Agent 1: Weather Analyzer</div>
        <div class="card">Agent 2: Soil Optimizer</div>
        <div class="card">Agent 3: Irrigation Planner</div>
      </section>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
